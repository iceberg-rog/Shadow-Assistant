port 1194
proto tcp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key /etc/openvpn/server/server.key
dh none
tls-crypt /etc/openvpn/server/ta.key
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256
keepalive 10 120
push "redirect-gateway def1 bypass-dhcp"
# Clients (phones especially) often have working IPv6 while this tunnel is v4-only.
# Without this the OS prefers IPv6, sends it outside the tunnel, and the user sees
# "connected but nothing loads".
push "block-ipv6"
ifconfig-pool-persist /etc/openvpn/server/ipp.txt
user nobody
group nogroup
persist-key
persist-tun
verb 3
verify-client-cert none
username-as-common-name
duplicate-cn
auth-user-pass-verify /opt/ovpnpanel/ovpn-auth.py via-file
script-security 2
management 127.0.0.1 7505
status /var/log/openvpn-status.log 5
push "dhcp-option DNS 10.8.0.1"
# Headroom for mobile carriers that quietly run a sub-1500 path MTU: full-size
# packets would be dropped and large pages/downloads would stall mid-transfer.
tun-mtu 1400
mssfix 1360
