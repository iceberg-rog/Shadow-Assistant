# Second OpenVPN instance on TCP 443.
# Same accounts, same panel - it exists purely as a disguise: an ISP that blocks
# or throttles "VPN-looking" traffic on 1194 usually leaves 443 alone, and with
# tls-crypt the OpenVPN handshake itself is encrypted, so a flow here looks like
# an ordinary TLS connection. Customers whose 1194 profile stalls use this one.
port 443
proto tcp
dev tun
topology subnet
server 10.9.0.0 255.255.255.0
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key /etc/openvpn/server/server.key
dh none
tls-crypt /etc/openvpn/server/ta.key
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256
keepalive 10 120
push "redirect-gateway def1 bypass-dhcp"
push "block-ipv6"
push "dhcp-option DNS 10.9.0.1"
ifconfig-pool-persist /etc/openvpn/server/ipp443.txt
user nobody
group nogroup
persist-key
persist-tun
verb 3
verify-client-cert none
username-as-common-name
duplicate-cn
auth-user-pass-verify /opt/ovpnpanel/ovpn-auth.py via-file
script-security 2
management 127.0.0.1 7506
status /var/log/openvpn-status-443.log 5
tun-mtu 1400
mssfix 1360
