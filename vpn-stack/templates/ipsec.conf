config setup
    uniqueids=no
    charondebug="ike 1, knl 1"

conn L2TP-PSK
    keyexchange=ikev1
    authby=secret
    type=transport
    left=%any
    leftid=__RELAY_IP__
    leftprotoport=17/1701
    right=%any
    rightprotoport=17/%any
    auto=add
    rekey=no
    fragmentation=yes
    ike=aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024,aes256-sha256-modp2048!
    esp=aes256-sha1,aes128-sha1,3des-sha1,aes256-sha256!
    dpddelay=45
    dpdtimeout=300
    dpdaction=clear
